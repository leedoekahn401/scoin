name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://schoolcoin:schoolcoin@localhost:5432/schoolcoin_test
  JWT_ACCESS_SECRET: ci-access
  JWT_REFRESH_SECRET: ci-refresh
  SEPAY_WEBHOOK_KEY: ci-sepay
  SCHOOL_BANK_NAME: MBBank
  SCHOOL_BANK_ACCOUNT: '0000000000'
  SCHOOL_BANK_HOLDER: CI SCHOOL

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolcoin
          POSTGRES_PASSWORD: schoolcoin
          POSTGRES_DB: schoolcoin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schoolcoin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Playwright (one happy path per app)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
