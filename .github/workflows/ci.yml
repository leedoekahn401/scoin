name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static checks: no database or browser needed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:design
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:engine
      - run: pnpm build

  # API end-to-end tests against a real Postgres (test/setup.ts resets the schema).
  api-e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://schoolcoin:schoolcoin@localhost:5432/schoolcoin_test
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      SEPAY_WEBHOOK_KEY: ci-sepay
      SCHOOL_BANK_NAME: MBBank
      SCHOOL_BANK_ACCOUNT: '0000000000'
      SCHOOL_BANK_HOLDER: CI SCHOOL
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schoolcoin
          POSTGRES_PASSWORD: schoolcoin
          POSTGRES_DB: schoolcoin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schoolcoin"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The seed imports built workspace packages (e.g. @schoolcoin/types/dist).
      - run: pnpm exec turbo run build --filter='@schoolcoin/api^...'
      - run: pnpm test:e2e

  # Playwright: one happy path per front-end app, in-browser mock API.
  ui:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_MODE: mock
      NEXT_PUBLIC_DEMO_TOOLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
